<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hub - القائمة الرئيسية</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #161b22;
            --accent-gold: #ffb703;
            --accent-blue: #00b4d8;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 50px 0 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--accent-blue);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .map-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .map-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(255, 183, 3, 0.15);
        }

        .map-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .map-card h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .map-card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .btn-select {
            background: var(--accent-blue);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-size: 1rem;
        }

        .map-card:hover .btn-select {
            background: var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 ROBLOX HUB 🎮</h1>
        <p>اختر الماب للبدء في عرض المهام والدلائل</p>
    </header>

    <div class="container">
        <h2 class="section-title">قائمة المابات المتاحة:</h2>
        
        <div class="maps-grid">
            <!-- كرت ماب Blox Fruits -->
            <a href="blox-fruits.html" class="map-card">
                <div>
                    <div class="map-icon">⚔️</div>
                    <h3>Blox Fruits</h3>
                    <p>دليل المهام الشامل للحصول على الأسلحة والأدوات النادرة.</p>
                </div>
                <button class="btn-select">دخول الماب</button>
            </a>
        </div>
    </div>

</body>
</html>
